test:
  source_files:
    - gh_src/tests
  imports:
    - dspy
  requires:
    - pip
    - pillow
    - pytest
    - pytest-mock
    - pytest-asyncio
    - pytorch
    - transformers
    - sentencepiece
    # Solver for some reason used wrong versions from run section in tests
    - gepa ==0.0.27
    - aiohttp ==3.13.5
  commands:
    - pip check
    - PYTHONPATH=gh_src pytest -vv gh_src/tests {{ ignore_tests }} {{ deselect_tests }}  # [not win]
    - set PYTHONPATH=gh_src && pytest -vv gh_src/tests {{ ignore_tests }} {{ deselect_tests }}  # [win]

