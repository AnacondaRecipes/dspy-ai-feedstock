{% set name = "dspy" %}
{% set version = "3.0.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: cb4529df9a91353a16144d9d94ba6ff25f36fc5adfd921f127f4c49d0e309fb8
  - url: https://github.com/stanfordnlp/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
    sha256: 62c3e84d8bb6a8c235010d283b17f9ea725a8b2a09c8e7e3689baa96f8f9a6f8
    folder: gh_src

build:
  number: 0
  skip: true  # [py<310 or py>314]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - setuptools >=77.0.1
  run:
    - python
    - backoff >=2.2
    - joblib ~=1.3
    - openai >=0.28.1
    - regex >=2023.10.3
    - orjson >=3.9.0
    - tqdm >=4.66.1
    - requests >=2.31.0
    - optuna >=3.4.0
    - pydantic >=2.0
    - magicattr >=0.1.6
    - litellm >=1.64.0
    - diskcache >=5.6.0
    - json-repair >=0.30.0
    - tenacity >=8.2.3
    - anyio
    - asyncer ==0.0.8
    - cachetools >=5.5.0
    - cloudpickle >=3.0.0
    - rich >=13.7.1
    - pillow>=10.1.0
    - numpy >=1.26.0
    - python-xxhash >=3.5.0
    - gepa ==0.0.17
  run_constrained:
    - anthropic >=0.18.0,<1.0.0
    - weaviate-client >=4.5.4,<4.6.0a0

{% set ignore_tests = "" %}
# ModuleNotFoundError: No module named 'datamodel_code_generator'
{% set ignore_tests = ignore_tests + " --ignore=gh_src/tests/reliability/test_generated.py" %}

{% set deselect_tests = "" %}
# FileNotFoundError: [Errno 2] No such file or directory: '$SRC_DIR/gh_src/tests/*
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/docs/test_mkdocs_links.py::test_nav_files_exist" %}
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/teleprompt/test_gepa.py::test_basic_workflow" %}
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/teleprompt/test_gepa.py::test_workflow_with_custom_instruction_proposer_and_component_selector" %}
# Requires a test server and sql database to be setup 
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/clients/test_cache.py::test_cache_consistency_with_lm_call_modifies_the_request" %}
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/clients/test_cache.py::test_save_and_load_memory_cache" %}
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/clients/test_cache.py::test_request_cache_decorator" %}
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/clients/test_lm.py::test_chat_lms_can_be_queried" %}
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/clients/test_lm.py::test_dspy_cache" %}
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/clients/test_lm.py::test_text_lms_can_be_queried" %}
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/clients/test_lm.py::test_lm_calls_support_callables" %}
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/clients/test_lm.py::test_lm_calls_support_pydantic_models" %}
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/clients/test_lm.py::test_responses_api_tool_calls" %}
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/streaming/test_streaming.py::test_streamify_yields_expected_response_chunks" %}
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/streaming/test_streaming.py::test_streaming_response_yields_expected_response_chunks" %}
# Windows errors out on it
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/evaluate/test_evaluate.py::test_multi_thread_evaluate_call_cancelled" %}  # [win]
# Windows RuntimeError: Failed to save state
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/signatures/test_adapter_image.py::test_predictor_save_load" %}  # [win]
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/signatures/test_adapter_image.py::test_save_load_complex_default_types" %}  # [win]
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/signatures/test_adapter_image.py::test_save_load_complex_types" %}  # [win]
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/signatures/test_adapter_image.py::test_save_load_pydantic_model" %}  # [win]
# AssertionError: assert 'openai/gpt-4o' == 'openai/gpt-4o-mini'
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/utils/test_settings.py::test_dspy_context_with_async_task_group" %}  # [win and py<313]

test:
  source_files:
    - gh_src/tests
  imports:
    - dspy
  requires:
    - pip
    - pytest
    - pytest-mock
    - pytest-asyncio
    - pytorch
    - transformers
  commands:
    - pip check
    - PYTHONPATH=gh_src pytest -vv gh_src/tests {{ ignore_tests }} {{ deselect_tests }}  # [not win]
    - set PYTHONPATH=gh_src && pytest -vv gh_src/tests {{ ignore_tests }} {{ deselect_tests }}  # [win]

about:
  home: https://github.com/stanfordnlp/dspy
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'DSPy: The framework for programming—not prompting—foundation models'
  description: 'DSPy: The framework for programming—not prompting—foundation models'
  doc_url: https://dspy-docs.vercel.app
  dev_url: https://github.com/stanfordnlp/dspy

extra:
  recipe-maintainers:
    - viridianmelody
