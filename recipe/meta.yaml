{% set name = "dspy" %}
{% set version = "3.2.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: 245d6531753cd3e844e7cc47835cfb283c8f57a36a977beabe5034457d9c7241
    patches:
      - patches/0001-fix-gepa-dependency.patch
      - patches/0002-relax-typeguard.patch
  - url: https://github.com/stanfordnlp/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
    sha256: e273a6f6ee8254857294cf4a02faf85ea7b42d58dad7f6838e482ea849f8cb07
    folder: gh_src

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310 or py>314]

requirements:
  host:
    - pip
    - python
    - setuptools >=77.0.1
  run:
    - python
    - openai >=0.28.1
    - regex >=2023.10.3
    - orjson >=3.9.0
    - tqdm >=4.66.1
    - requests >=2.31.0
    - pydantic >=2.0
    - litellm >=1.64.0
    - diskcache >=5.6.0
    - json-repair >=0.54.2
    - tenacity >=8.2.3
    - anyio
    - asyncer ==0.0.8
    - cachetools >=5.5.0
    - cloudpickle >=3.1.2
    - numpy >=1.26.0
    - python-xxhash >=3.5.0
    - gepa ==0.0.27
    # Relax typeguard to 4.4.4 to fix IndexError and TypeError from 4.4.3
    # https://github.com/agronholm/typeguard/releases/tag/4.4.4
    - typeguard ==4.4.4
  run_constrained:
    - anthropic >=0.18.0,<1.0.0
    - weaviate-client >=4.5.4,<4.6.0
    - optuna >=3.4.0

